name: Cross-Platform Builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'sys/core/**'
      - 'sys/mobile/**'
      - 'scripts/package/**'
      - '.github/workflows/cross-platform.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable

      - name: Build core (release)
        working-directory: sys/core
        run: cargo build --release

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package/package-noa.ps1 -Platform windows

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: bash ./scripts/package/package-noa.sh macos

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: bash ./scripts/package/package-noa.sh linux

      - name: Check mobile companion
        working-directory: sys/mobile
        run: cargo check

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: noa-windows-package
          path: dist/windows/noa-windows.zip

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: noa-macos-package
          path: dist/macos/noa-macos.tar.gz

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: noa-linux-package
          path: dist/linux/noa-linux.tar.gz
