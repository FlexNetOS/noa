# FlexNetOS Automation Caller Template
# Copy this file to your repository's .github/workflows/ directory
# This enables fully automated issue resolution and PR merging

name: FlexNetOS Auto-Resolve

on:
  # Trigger on PR events
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

  # Trigger on PR reviews
  pull_request_review:
    types: [submitted]

  # Trigger on review comments
  pull_request_review_comment:
    types: [created]

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process (leave empty for latest)'
        required: false
      force_resolve:
        description: 'Force resolution even if already attempted'
        required: false
        default: 'false'

# Permissions needed for full automation
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: write
  security-events: read

jobs:
  # Call the reusable workflow from this repository
  auto-resolve:
    name: 🤖 Auto-Resolve
    uses: ./.github/workflows/flexnetos-reusable-resolver.yml
    with:
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      max_iterations: 10
      ai_provider: copilot  # Options: copilot, web-claude, web-gpt, web-gemini, local
      auto_merge: true
      security_scan: true
      quality_gates: true
    secrets:
      BOT_TOKEN: ${{ secrets.FLEXNETOS_BOT_TOKEN || github.token }}
      AI_SESSION_TOKEN: ${{ secrets.AI_SESSION_TOKEN }}  # Optional: for web AI providers

  # Optional: Post-merge actions
  post-merge:
    name: 📦 Post-Merge
    needs: auto-resolve
    if: needs.auto-resolve.outputs.merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log Success
        run: |
          echo "🎉 PR successfully auto-merged!"
          echo "Fixes applied: ${{ needs.auto-resolve.outputs.total_fixes }}"

