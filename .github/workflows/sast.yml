name: sast

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 7 * * 1" # weekly

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (OSS rules)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"


