# NOA CI Pipeline
# Runs on push to main and pull requests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust build and test
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          workspaces: sys/core

      - name: Check formatting
        working-directory: sys/core
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: sys/core
        run: cargo clippy --all-targets --all-features -- -D clippy::correctness -A dead_code -A unused

      - name: Build
        working-directory: sys/core
        run: cargo build --release

      - name: Test
        working-directory: sys/core
        run: cargo test --release

  # Go build and test
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23'
          cache-dependency-path: p2p/go.sum

      - name: Download dependencies
        working-directory: p2p
        run: go mod download

      - name: Build
        working-directory: p2p
        run: go build -v ./...

      - name: Test
        working-directory: p2p
        run: go test -v ./...

  # TypeScript build and lint
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sys/ui/package-lock.json

      - name: Install dependencies
        working-directory: sys/ui
        run: npm ci

      - name: Type check
        working-directory: sys/ui
        run: npm run type-check

      - name: Lint
        working-directory: sys/ui
        run: npm run lint

      - name: Build
        working-directory: sys/ui
        run: npm run build

  # Python lint and test
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sys/digest
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: sys/digest
        run: ruff check .

      - name: Type check
        working-directory: sys/digest
        run: mypy src/

      - name: Test
        working-directory: sys/digest
        run: pytest

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@76071ef0d7ec797419534a183b498b4d6366cf37
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Prerequisites check
  prerequisites:
    name: Prerequisites Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Make script executable
        run: chmod +x init/check-prereqs.sh

      - name: Run prerequisites check
        run: ./init/check-prereqs.sh --json --allow-global
