# NOA CI Pipeline
# Runs on push to main and pull requests

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust build and test
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sys/core

      - name: Check formatting
        working-directory: sys/core
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: sys/core
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        working-directory: sys/core
        run: cargo build --release

      - name: Test
        working-directory: sys/core
        run: cargo test --release

  # Go build and test
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: p2p/go.sum

      - name: Download dependencies
        working-directory: p2p
        run: go mod download

      - name: Build
        working-directory: p2p
        run: go build -v ./...

      - name: Test
        working-directory: p2p
        run: go test -v ./...

  # TypeScript build and lint
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sys/ui/package-lock.json

      - name: Install dependencies
        working-directory: sys/ui
        run: npm ci

      - name: Type check
        working-directory: sys/ui
        run: npm run type-check

      - name: Lint
        working-directory: sys/ui
        run: npm run lint

      - name: Build
        working-directory: sys/ui
        run: npm run build

  # Python lint and test
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: sys/digest
        run: |
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: sys/digest
        run: ruff check .

      - name: Type check
        working-directory: sys/digest
        run: mypy src/

      - name: Test
        working-directory: sys/digest
        run: pytest

  # Security scanning
  security:
    name: Security Scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Prerequisites check
  prerequisites:
    name: Prerequisites Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x init/check-prereqs.sh

      - name: Run prerequisites check
        run: ./init/check-prereqs.sh --json
