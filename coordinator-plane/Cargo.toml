[package]
name = "coordinator-plane"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Coordinator plane for 3-plane architecture - audit, analytics, and promotion decisions"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "json", "chrono", "uuid"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# UUID & Time
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Crypto for checksums
sha2 = "0.10"

