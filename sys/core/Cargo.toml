# NOA Core Workspace
# Rust workspace configuration for all NOA system crates

[package]
name = "noa-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NOA Core - Autonomous Agentic Operating System"

[[bin]]
name = "noa"
path = "src/main.rs"

[lib]
name = "noa_core"
path = "src/lib.rs"

[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/embedder",
    "crates/trainer",
    "crates/indexer",
    "crates/agent",
    "crates/common",
    "crates/neural",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/FlexNetOS/noa"
authors = ["FlexNetOS Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "timeout"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "json", "chrono", "uuid"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab", "functions"] }

# Vector embeddings
fastembed = "4"
candle-core = "0.8"
candle-transformers = "0.8"

# ML/AI dependencies (Phase 4 - US2)
# burn-rs for training (T097) - Optional, add when training features needed
# burn = { version = "0.15", features = ["wgpu", "tch"] }

# Tokenizers for HuggingFace tokenization (T099)
tokenizers = "0.19"

# Qdrant client for vector store (T100)
qdrant-client = "1.9"

# CUDA 13.1+ support via tch (T101) - Optional, enable when CUDA needed
# tch = { version = "0.13", features = ["cuda"] }

# WGPU backend for cross-platform GPU (T102) - Optional, enable when GPU needed
# wgpu = "0.20"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"] }
tracing-appender = "0.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"
futures = "0.3"

# UUID & Time
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Crypto
sha2 = "0.10"
blake3 = "1.5"
once_cell = "1.19"

# gRPC & Protobuf
tonic = "0.12"
prost = "0.13"

# Internal crates
noa-api = { path = "crates/api" }
noa-embedder = { path = "crates/embedder" }
noa-trainer = { path = "crates/trainer" }
noa-indexer = { path = "crates/indexer" }
noa-agent = { path = "crates/agent" }
noa-common = { path = "crates/common" }
noa-neural = { path = "crates/neural" }

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
config = { workspace = true }
dotenvy = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
once_cell = { workspace = true }
tokio-stream = { workspace = true }
futures = "0.3"
tracing-appender = "0.2"
regex = "1.12"
reqwest = { version = "0.12", features = ["json"] }
prometheus = "0.13"
lazy_static = "1.5"

# Internal crates
noa-api = { workspace = true }
noa-common = { workspace = true }
noa-neural = { workspace = true }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
