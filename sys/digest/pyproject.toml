[project]
name = "noa-digest"
version = "0.1.0"
description = "NOA Digest Everything Pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "FlexNetOS Team"}
]
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.22.0",
    "tree-sitter-javascript>=0.22.0",
    "tree-sitter-typescript>=0.22.0",
    "tree-sitter-go>=0.22.0",
    "tree-sitter-rust>=0.22.0",
    "tree-sitter-java>=0.22.0",
    "pydantic>=2.10.4",
    "httpx>=0.28.1",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.1",
    "ruff>=0.8.4",
    "mypy>=1.14.1",
]

[project.scripts]
noa-digest = "noa_digest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true

