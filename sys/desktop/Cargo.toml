[package]
name = "noa-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "NOA Desktop Containment Layer (NDCL)"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
sha2 = "0.10"
serde_yaml = "0.9"
url = "2.5"
