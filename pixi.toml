# NOA Platform - Pixi Workspace configsuration
# This manifest defines the cross-platform development environment
# See: https://pixi.sh/latest/reference/pixi_manifest/

[workspace]
name = "noa"
version = "0.1.0"
description = "NOA Platform - Autonomous Agentic Operating System"
authors = ["FlexNetOS Team <noa@flexnetos.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

# ============================================================================
# Core Dependencies - Available on ALL platforms
# ============================================================================
[dependencies]
# Build Tools
cmake = ">=3.28"
ninja = ">=1.11"

# C/C++ Libraries (with headers!) - solves the libcurl problem
libcurl = ">=8.0"
zlib = ">=1.3"
openssl = ">=3.0"

# Rust Toolchain
rust = ">=1.82"

# Node.js Ecosystem
nodejs = ">=20"
pnpm = ">=9.0"

# Shell - Unified cross-platform shell
nushell = ">=0.101"

# Python (for ML/AI workloads)
python = ">=3.11"

# CLI Tools
ripgrep = ">=14"
fd-find = ">=9"
direnv = ">=2.37.1,<3"

# ============================================================================
# Platform-specific dependencies
# ============================================================================
[target.linux-64.dependencies]
make = ">=4.3"
git = ">=2.40"

[target.osx-64.dependencies]
make = ">=4.3"
git = ">=2.40"

[target.osx-arm64.dependencies]
make = ">=4.3"
git = ">=2.40"

[target.win-64.dependencies]
aider-chat = ">=0.86.1,<0.87"
chezmoi = ">=2.68.1,<3"

# Windows uses system git (already in bin/)

# ============================================================================
# Feature: llama.cpp Development
# Activate with: pixi run -e llama <task>
# ============================================================================
[feature.llama.dependencies]
# Provides C/C++ compiler toolchain for building llama.cpp
clang = ">=18"

# ============================================================================
# Feature: ML/AI Development
# Activate with: pixi run -e ml <task>
# ============================================================================
[feature.ml.dependencies]
pytorch = ">=2.0"
scikit-learn = ">=1.4"
numpy = ">=1.26"
pandas = ">=2.0"

# ============================================================================
# Feature: Documentation
# Activate with: pixi run -e docs <task>
# ============================================================================
[feature.docs.dependencies]
mdbook = ">=0.4"

# ============================================================================
# Environments - Combinations of features
# ============================================================================
[environments]
default = { features = [], solve-group = "default" }
llama = { features = ["llama"], solve-group = "default" }
ml = { features = ["llama", "ml"], solve-group = "ml" }
docs = { features = ["docs"], solve-group = "default" }

# ============================================================================
# Tasks - Common operations
# ============================================================================
[tasks]
# === Shell ===
shell = { cmd = "nu", description = "Start Nushell" }

# === Build ===
build-core = { cmd = "cargo build --workspace", cwd = "sys/core", description = "Build NOA core crates" }
build-core-release = { cmd = "cargo build --workspace --release", cwd = "sys/core", description = "Build NOA core (release)" }
test-core = { cmd = "cargo test --workspace", cwd = "sys/core", description = "Test NOA core crates" }

# === llama.cpp ===
build-llama = { cmd = "cmake -B build && cmake --build build -j", cwd = "llama.cpp", description = "Build llama.cpp" }
build-llama-server = { cmd = "cmake -B build && cmake --build build -j --target llama-server", cwd = "llama.cpp", description = "Build llama-server" }

# === UI ===
ui-install = { cmd = "pnpm install --frozen-lockfile", cwd = "sys/ui", description = "Install UI dependencies" }
ui-build = { cmd = "pnpm run build", cwd = "sys/ui", description = "Build UI" }
ui-dev = { cmd = "pnpm run dev", cwd = "sys/ui", description = "Start UI dev server" }

# === Utilities ===
check = { cmd = "cargo clippy --workspace", cwd = "sys/core", description = "Run clippy checks" }
fmt = { cmd = "cargo fmt --all", cwd = "sys/core", description = "Format Rust code" }

# ============================================================================
# System Requirements
# ============================================================================
[system-requirements]
linux = "4.18"
