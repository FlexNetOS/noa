[package]
name = "noa-api-client"
version = "0.1.0"
edition = "2024"
description = "API client for NOA platform - shared by Dioxus UI"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt", "macros"] }
futures = "0.3"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }

