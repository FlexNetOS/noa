# CSV Schema: Agent Directory Export
# Purpose: Export agent registry for analysis, reporting, and backup
# FR-006: Full audit trail and transparency

schema_version: "1.0"
name: agent_directory
description: "Schema for exporting NOA agent directory"
entity: agent

columns:
  - name: id
    type: string
    format: uuid
    description: "Unique agent identifier"
    required: true
    
  - name: name
    type: string
    max_length: 255
    pattern: "^[A-Z][a-zA-Z]+Agent$"
    description: "Agent name (must end with 'Agent')"
    required: true
    
  - name: type
    type: enum
    values: ["permanent", "board", "stack", "dynamic"]
    description: "Agent classification"
    required: true
    
  - name: status
    type: enum
    values: ["active", "paused", "retired"]
    description: "Current operational status"
    required: true
    
  - name: version
    type: string
    format: semver
    description: "Agent version (semantic versioning)"
    required: true
    
  - name: capabilities
    type: array
    item_type: string
    separator: "|"
    description: "Pipe-separated list of capabilities"
    required: true
    
  - name: parent_id
    type: string
    format: uuid
    nullable: true
    description: "Parent agent ID for hierarchy"
    
  - name: created_at
    type: datetime
    format: "ISO8601"
    description: "Registration timestamp"
    required: true
    
  - name: last_active
    type: datetime
    format: "ISO8601"
    nullable: true
    description: "Last activity timestamp"

# Export configuration
export_config:
  filename_pattern: "agents_{date}_{time}.csv"
  date_format: "%Y%m%d"
  time_format: "%H%M%S"
  encoding: "utf-8"
  delimiter: ","
  quoting: "minimal"
  include_header: true
  
# Filters for selective export
filters:
  - name: active_only
    condition: "status = 'active'"
    default: false
  - name: permanent_only
    condition: "type = 'permanent'"
    default: false
  - name: with_parent
    condition: "parent_id IS NOT NULL"
    default: false




