# CSV Schema: Claims and Evidence Ledger Export
# Purpose: Export verified claims and supporting evidence for audit
# FR-005: Total Memory Sovereignty - nothing is forgotten

schema_version: "1.0"
name: claims_evidence
description: "Schema for exporting NOA claims and evidence ledger"

entities:
  claims:
    columns:
      - name: id
        type: string
        format: uuid
        description: "Unique claim identifier"
        required: true
        
      - name: statement
        type: text
        description: "The claim statement"
        required: true
        
      - name: verified
        type: boolean
        description: "Whether claim has been verified"
        required: true
        
      - name: confidence
        type: float
        min: 0.0
        max: 1.0
        nullable: true
        description: "Confidence score (0-1)"
        
      - name: source
        type: string
        description: "Origin of the claim"
        required: true
        
      - name: category
        type: string
        nullable: true
        description: "Claim category for organization"
        
      - name: evidence_count
        type: integer
        computed: true
        description: "Number of supporting evidence items"
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true
        
      - name: verified_at
        type: datetime
        format: "ISO8601"
        nullable: true
        
      - name: verified_by
        type: string
        format: uuid
        nullable: true
        description: "Agent that verified the claim"

  evidence:
    columns:
      - name: id
        type: string
        format: uuid
        required: true
        
      - name: claim_id
        type: string
        format: uuid
        description: "Associated claim"
        required: true
        
      - name: source
        type: string
        description: "Evidence source"
        required: true
        
      - name: source_type
        type: enum
        values: ["url", "file", "api", "agent", "user"]
        required: true
        
      - name: content_preview
        type: string
        max_length: 500
        description: "First 500 chars of content"
        
      - name: hash
        type: string
        format: sha256
        description: "SHA-256 content hash"
        required: true
        
      - name: reliability_score
        type: float
        min: 0.0
        max: 1.0
        nullable: true
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true

# Export configuration  
export_config:
  filename_pattern: "ledger_{entity}_{date}.csv"
  encoding: "utf-8"
  delimiter: ","
  include_header: true
  
# Audit reports
reports:
  - name: unverified_claims
    entity: claims
    filter: "verified = 0"
    order_by: "timestamp DESC"
    
  - name: high_confidence_claims
    entity: claims
    filter: "verified = 1 AND confidence >= 0.9"
    order_by: "confidence DESC"
    
  - name: evidence_by_source
    entity: evidence
    filter: null
    order_by: "source_type, timestamp DESC"




