# CSV Schema: Task Tables Export
# Purpose: Export task queue for analysis, reporting, and backup
# FR-005: Complete audit trail

schema_version: "1.0"
name: task_tables
description: "Schema for exporting NOA task queue and events"

# Primary entity: Task
entities:
  task:
    columns:
      - name: id
        type: string
        format: uuid
        description: "Unique task identifier"
        required: true
        
      - name: title
        type: string
        max_length: 500
        description: "Task title"
        required: true
        
      - name: description
        type: text
        description: "Detailed task description"
        nullable: true
        
      - name: status
        type: enum
        values: ["pending", "in_progress", "blocked", "completed", "failed", "cancelled"]
        description: "Current task status"
        required: true
        
      - name: priority
        type: integer
        min: -1000
        max: 1000
        description: "Task priority (higher = more urgent)"
        required: true
        
      - name: assigned_agent
        type: string
        format: uuid
        nullable: true
        description: "Agent currently working on task"
        
      - name: stack_id
        type: string
        format: uuid
        nullable: true
        description: "Parent MicroAgentStack"
        
      - name: parent_task_id
        type: string
        format: uuid
        nullable: true
        description: "Parent task for decomposition"
        
      - name: deadline
        type: datetime
        format: "ISO8601"
        nullable: true
        description: "Task deadline"
        
      - name: retry_count
        type: integer
        min: 0
        description: "Number of retry attempts"
        required: true
        
      - name: max_retries
        type: integer
        min: 0
        description: "Maximum retry attempts"
        required: true
        
      - name: created_at
        type: datetime
        format: "ISO8601"
        required: true
        
      - name: updated_at
        type: datetime
        format: "ISO8601"
        required: true

  task_event:
    columns:
      - name: id
        type: string
        format: uuid
        required: true
        
      - name: task_id
        type: string
        format: uuid
        description: "Related task"
        required: true
        
      - name: event_type
        type: enum
        values: ["created", "assigned", "started", "progress", "completed", "failed", "retried", "cancelled"]
        required: true
        
      - name: agent_id
        type: string
        format: uuid
        nullable: true
        description: "Agent that triggered event"
        
      - name: old_status
        type: string
        nullable: true
        
      - name: new_status
        type: string
        nullable: true
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true

# Export configuration
export_config:
  filename_pattern: "tasks_{entity}_{date}.csv"
  encoding: "utf-8"
  delimiter: ","
  include_header: true
  
# Predefined reports
reports:
  - name: active_tasks
    entity: task
    filter: "status IN ('pending', 'in_progress', 'blocked')"
    order_by: "priority DESC, deadline ASC"
    
  - name: failed_tasks
    entity: task
    filter: "status = 'failed'"
    order_by: "updated_at DESC"
    
  - name: task_history
    entity: task_event
    filter: "timestamp > datetime('now', '-7 days')"
    order_by: "timestamp DESC"




