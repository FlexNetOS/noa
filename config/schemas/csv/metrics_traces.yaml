# CSV Schema: Metrics and Traces Export
# Purpose: Export observability data for analysis and debugging
# FR-155: Observability - tracing, metrics, logging

schema_version: "1.0"
name: metrics_traces
description: "Schema for exporting NOA observability data"

entities:
  traces:
    columns:
      - name: id
        type: string
        format: uuid
        description: "Unique trace ID"
        required: true
        
      - name: run_id
        type: string
        description: "Execution run identifier"
        required: true
        
      - name: parent_trace_id
        type: string
        format: uuid
        nullable: true
        description: "Parent trace for hierarchy"
        
      - name: action
        type: string
        description: "Action being traced"
        required: true
        
      - name: status
        type: enum
        values: ["success", "failure", "timeout", "cancelled"]
        required: true
        
      - name: duration_ms
        type: integer
        nullable: true
        description: "Execution duration in milliseconds"
        
      - name: agent_id
        type: string
        format: uuid
        nullable: true
        description: "Agent that executed the action"
        
      - name: error
        type: text
        nullable: true
        description: "Error message if failed"
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true

  metrics:
    columns:
      - name: id
        type: string
        format: uuid
        required: true
        
      - name: name
        type: string
        description: "Metric name"
        required: true
        
      - name: value
        type: float
        description: "Metric value"
        required: true
        
      - name: unit
        type: string
        nullable: true
        description: "Unit of measurement"
        
      - name: component
        type: string
        description: "Source component"
        required: true
        
      - name: labels
        type: string
        description: "JSON-encoded labels"
        nullable: true
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true

  health_metric:
    columns:
      - name: id
        type: string
        format: uuid
        required: true
        
      - name: component
        type: string
        required: true
        
      - name: metric_type
        type: enum
        values: ["cpu", "memory", "latency", "error_rate", "success_rate", "throughput"]
        required: true
        
      - name: value
        type: float
        required: true
        
      - name: threshold_warning
        type: float
        nullable: true
        
      - name: threshold_critical
        type: float
        nullable: true
        
      - name: status
        type: enum
        values: ["healthy", "warning", "critical"]
        required: true
        
      - name: timestamp
        type: datetime
        format: "ISO8601"
        required: true

# Export configuration
export_config:
  filename_pattern: "observability_{entity}_{date}_{time}.csv"
  encoding: "utf-8"
  delimiter: ","
  include_header: true
  
# Time-series reports
reports:
  - name: trace_errors
    entity: traces
    filter: "status IN ('failure', 'timeout')"
    order_by: "timestamp DESC"
    
  - name: slow_traces
    entity: traces
    filter: "duration_ms > 1000"
    order_by: "duration_ms DESC"
    
  - name: critical_health
    entity: health_metric
    filter: "status = 'critical'"
    order_by: "timestamp DESC"
    
  - name: hourly_metrics
    entity: metrics
    filter: "timestamp > datetime('now', '-1 hour')"
    order_by: "timestamp DESC"
    
# Aggregation queries for reporting
aggregations:
  - name: trace_stats_by_action
    entity: traces
    group_by: "action"
    metrics:
      - "COUNT(*) as total_count"
      - "AVG(duration_ms) as avg_duration"
      - "MAX(duration_ms) as max_duration"
      - "SUM(CASE WHEN status = 'failure' THEN 1 ELSE 0 END) as failure_count"
      
  - name: health_summary
    entity: health_metric
    group_by: "component, metric_type"
    metrics:
      - "AVG(value) as avg_value"
      - "MAX(value) as max_value"
      - "MIN(value) as min_value"
      - "COUNT(*) as sample_count"




