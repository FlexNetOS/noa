$schema: "https://noa.local/schemas/providers.yaml"
version: "1.0.0"
providerPriority:
  - local
  - hybrid
  - ide
  - cloud
providers:
  local:
    enabled: true
    priority: 1
    types: ["llama.cpp", "git"]
    configPath: "${NOA_ROOT}/ai/providers/local"
  hybrid:
    enabled: true
    priority: 2
    types: ["cursor"]
    configPath: "${NOA_ROOT}/ai/providers/hybrid"
  ide:
    enabled: true
    priority: 4
    types: ["copilot"]
    configPath: "${NOA_ROOT}/ai/providers/ide"
  cloud:
    enabled: true
    priority: 3
    types: ["claude", "codex", "abacus"]
    configPath: "${NOA_ROOT}/ai/providers/cloud"
sharedResources:
  agents: "${NOA_ROOT}/ai/shared/agents"
  workflows: "${NOA_ROOT}/ai/shared/workflows"
  prompts: "${NOA_ROOT}/ai/shared/prompts"
  skills: "${NOA_ROOT}/ai/shared/skills"
  tools: "${NOA_ROOT}/ai/shared/tools"
  models: "${NOA_ROOT}/ai/shared/models"
  commands: "${NOA_ROOT}/ai/shared/commands"
  resources: "${NOA_ROOT}/ai/shared/resources"
systemPrompts:
  enabled: true
  basePrompts:
    - name: ultrathink
      file: ultrathink.md
      inject: always
      priority: 1
      description: "High-bar execution mindset for all providers"
  contextualPrompts:
    - name: project-mgmt-prompt
      file: project-mgmt-prompt.md
      inject: on-demand
      priority: 2
      triggers:
        - project
        - task
        - milestone
  promptPath: "${NOA_ROOT}/ai/shared/prompts"
executionMemory:
  enabled: true
  path: "${NOA_ROOT}/ai/shared/resources/execution-memory.db"
  features:
    - context_sharing
    - reasoning_state
    - provider_state_sync
models:
  defaultContextLength: 2048
  defaultTemperature: 0.7
  defaultTopP: 0.9
  defaultTopK: 40
  defaultRepeatPenalty: 1.1
  supportedFormats:
    - gguf
    - safetensors
  modelPaths:
    local: "${NOA_ROOT}/ai/shared/models"
providerSwitching:
  enabled: true
  preserveConfigs: true
  migrateState: true
