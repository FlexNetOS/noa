# NOA Sandbox-Plane Environment
# Conda environment for portable Jupyter kernel

name: noa-sandbox
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - ipykernel>=7.1.0
  - nb_conda_kernels>=2.5.1
  # QA & Testing
  - requests>=2.31
  - pytest>=8.0
  # Data handling
  - pandas>=2.0
  - numpy>=1.26
  # Notebook utilities
  - nbformat>=5.10
  - nbconvert>=7.16
