[package]
name = "rust-lovable"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Dioxus dependencies
dioxus = { version = "0.7" }
dioxus-logger = "0.7"
dioxus-router = "0.7"
dioxus-hooks = "0.7"
dioxus-signals = "0.7"

# Web and HTTP
# tokio is optional - only needed for server, doesn't compile for wasm
tokio = { version = "1.0", features = ["full"], optional = true }
# reqwest is configured via target-specific dependencies below
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
hyper = { version = "1.0", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

# Compression and capacity management
flate2 = { version = "1.0", optional = true }
brotli = { version = "3.3", optional = true }
zstd = { version = "0.13", optional = true }
lz4_flex = { version = "0.11", optional = true }
bzip2 = { version = "0.4", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# AI and ML specific
ndarray = { version = "0.15", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
tokenizers = { version = "0.15", features = ["http"], optional = true }

# Vector database and embeddings
pgvector = { version = "0.3", features = ["sqlx"], optional = true }

# Distributed systems
jj-lib = { version = "0.36", optional = true }

# Resource sharing and caching
moka = { version = "0.12", features = ["future"], optional = true }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }

# Monitoring and metrics
prometheus = { version = "0.13", optional = true }
metrics = { version = "0.22", optional = true }
metrics-exporter-prometheus = { version = "0.13", optional = true }

# AI and ML integrations
# Local vendored crates (stubs until real implementations ready)
ruv-fann = { version = "0.1.0", path = "crates/ruv-fann", optional = true }
ruvector = { version = "0.1.0", path = "crates/ruvector", optional = true }
qudag = { version = "0.1.0", path = "crates/qudag", optional = true }
libp2p = { version = "0.55", optional = true }

# Database and storage
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "chrono", "uuid"], optional = true }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"], optional = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
once_cell = "1.20"
dashmap = "6.0"
async-trait = "0.1"
futures = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
pin-project-lite = { version = "0.2", optional = true }
tokio-stream = { version = "0.1", optional = true }

# File and path handling
camino = "1.1"
walkdir = "2.0"

# Configuration
config = "0.14"
dirs = "5.0"

# CLI support
clap = { version = "4.5", features = ["derive"] }

# Web scraping (for Open-Lovable functionality)
scraper = "0.20"
select = "0.6"

# Code generation and parsing
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[features]
default = ["desktop", "fullstack"]

# Platform targets - web doesn't include desktop to avoid native TLS on WASM
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "fullstack"]
mobile = ["dioxus/mobile", "fullstack"]

# Fullstack modes
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "fullstack", "dep:axum", "dep:tower", "dep:tower-http", "dep:hyper", "dep:tokio"]

# Optional integrations
ai-integrations = ["ruv-fann", "ruvector", "qudag", "libp2p", "ndarray", "candle-core", "candle-nn", "candle-transformers", "tokenizers"]
database = ["sqlx", "sea-orm", "pgvector"]
compression = ["flate2", "brotli", "zstd", "lz4_flex", "bzip2", "xxhash-rust", "futures", "async-stream", "pin-project-lite", "tokio-stream"]
caching = ["moka", "redis"]
monitoring = ["prometheus", "metrics", "metrics-exporter-prometheus"]
distributed = ["jj-lib", "libp2p"]
ml-devops = ["ai-integrations", "database", "compression", "caching", "monitoring"]

[[bin]]
name = "rust-lovable"
path = "src/main.rs"

# WASM-specific dependencies - getrandom needs js feature for browser compatibility
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# reqwest for WASM uses js features
reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# reqwest for non-wasm
reqwest = { version = "0.12", features = ["json", "multipart", "native-tls"] }

[dev-dependencies]
tokio-test = "0.4"