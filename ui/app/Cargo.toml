
[workspace]
resolver = "2"
members = [
	"crates/noa-ui-paths",
	"crates/noa-ui-protocol",
	"crates/noa-ui-styleguide-api",
	"crates/noa-ui-styleguide-ui",
	"crates/noa-ui-core",
	"crates/noa-ui-shell",
	"crates/noa-ui-components",
	"crates/noa-ui-vibe-coding",
	"crates/noa-ui-mlops",
	"crates/noa-ui-resources",
	"bins/noa-ui-desktop",
	"bins/noa-ui-web",
	"bins/noa-ui-hived",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dioxus = { version = "0.7.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# UI Component Libraries (optional - use native DaisyUI classes directly)
# dioxus-primitives = "0.0"  # Not yet released
# daisy_rsx = "0.1"  # Use DaisyUI classes directly instead

# P2P and State Sync
loro = "1.4"
iroh = "0.32"
libp2p = { version = "0.55", features = ["gossipsub", "kad", "request-response", "tokio"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"

# Utility crates
uuid = { version = "1.0", features = ["v4"] }
camino = "1.1"
walkdir = "2.0"
dirs = "5.0"
num_cpus = "1.16"

# Internal crates
noa-ui-components = { path = "crates/noa-ui-components" }
noa-ui-core = { path = "crates/noa-ui-core" }
noa-ui-shell = { path = "crates/noa-ui-shell" }
noa-ui-protocol = { path = "crates/noa-ui-protocol" }
noa-ui-vibe-coding = { path = "crates/noa-ui-vibe-coding" }
noa-ui-mlops = { path = "crates/noa-ui-mlops" }
noa-ui-resources = { path = "crates/noa-ui-resources" }
noa-api-client = { path = "../../gateway/api/client/rust" }
