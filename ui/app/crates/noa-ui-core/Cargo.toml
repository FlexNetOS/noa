[package]
name = "noa-ui-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.0"
once_cell = "1.20"
dashmap = "6.0"
camino = "1.1"
walkdir = "2.0"
configs = "0.14"
dirs = "5.0"
num_cpus = "1.16"
reqwest = { version = "0.12", features = ["json"], optional = true }

noa-ui-paths = { path = "../noa-ui-paths" }

[features]
default = []
configs-extended = []
metadata = []
http-client = ["reqwest"]
compression = []  # Placeholder for noa_common::compression integration
full = ["configs-extended", "metadata", "http-client"]
