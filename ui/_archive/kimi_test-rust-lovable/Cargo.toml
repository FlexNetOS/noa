[package]
name = "rust-lovable"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core Dioxus dependencies
dioxus = { version = "0.6" }
dioxus-logger = "0.6"
dioxus-router = "0.6"
dioxus-hooks = "0.6"
dioxus-signals = "0.6"

# Web and HTTP
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
axum = { version = "0.7", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# AI and ML integrations
# Future integrations (feature flags)
ruv-fann = { version = "0.1.0", path = "crates/ruv-fann", optional = true }
ruvector = { version = "0.1.0", path = "crates/ruvector", optional = true }
qudag = { version = "0.1.0", path = "crates/qudag", optional = true }
libp2p = { version = "0.55", optional = true }

# Database and storage
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "postgres", "chrono", "uuid"], optional = true }
sea-orm = { version = "1.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls", "macros"], optional = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.0"
once_cell = "1.20"
dashmap = "6.0"

# File and path handling
camino = "1.1"
walkdir = "2.0"

# Configuration
config = "0.14"
dirs = "5.0"

# CLI support
clap = { version = "4.5", features = ["derive"] }

# Web scraping (for Open-Lovable functionality)
scraper = "0.20"
select = "0.6"

# Code generation and parsing
syn = { version = "2.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"

[features]
default = ["desktop", "fullstack"]

# Platform targets
web = ["dioxus/web", "fullstack"]
desktop = ["dioxus/desktop", "fullstack"]
mobile = ["dioxus/mobile", "fullstack"]

# Fullstack modes
fullstack = ["dioxus/fullstack"]
server = ["dioxus/server", "fullstack", "dep:axum", "dep:tower-http"]

ai-integrations = ["ruv-fann", "ruvector", "qudag", "libp2p"]
database = ["sqlx", "sea-orm"]

[[bin]]
name = "rust-lovable"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"